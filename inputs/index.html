<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Update NFC Card | Premium NFC Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>✨ Update Your NFC Card</h1>
    <p>Fill in your details to personalize your premium digital card</p>
  </div>

  <form id="nfc-form">
    <!-- Basic Info -->
    <div class="form-card">
      <h2 class="section-title">Basic Information</h2>
      <div class="form-group">
        <label>Card ID <span class="required">*</span></label>
        <input type="text" name="card_id" placeholder="e.g., CARD001" required />
      </div>
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="name" placeholder="Jonathan Sterling" required />
      </div>
      <div class="input-row">
        <div class="form-group">
          <label>Title / Designation</label>
          <input type="text" name="title" placeholder="Chief Executive Officer" />
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" name="company" placeholder="Sterling Industries" />
        </div>
      </div>
      <div class="form-group">
        <label>Tagline / Bio</label>
        <input type="text" name="tagline" placeholder="Building tomorrow's innovations..." />
      </div>
      <div class="form-group">
        <label>Profile Photo</label>
        <div class="file-input-wrapper">
          <label class="file-input-label" for="photo">
            <span>Click to upload photo (JPG, PNG)</span>
          </label>
          <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" />
        </div>
        <img id="photo-preview" style="display:none">
      </div>
    </div>

    <!-- Contact Section -->
    <div class="form-card">
      <h2 class="section-title">Contact Details</h2>
      <div class="input-row">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="+1 234 567 890" />
        </div>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="tel" name="whatsapp" placeholder="+1 234 567 890" />
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="contact@sterling.com" />
      </div>
      <div class="form-group">
        <label>Location (Google Maps URL)</label>
        <input type="url" name="location" placeholder="https://maps.google.com/?q=..." />
      </div>
      <div class="form-group">
        <label>UPI ID / Payment Link</label>
        <input type="text" name="upi" placeholder="yourname@upi or payment URL" />
      </div>
    </div>

    <!-- Profile Section -->
    <div class="form-card">
      <h2 class="section-title">Profile Details</h2>
      <div class="form-group">
        <label>About Me</label>
        <textarea name="about" placeholder="Write a brief introduction about yourself..."></textarea>
      </div>
      <div class="form-group">
        <label>Skills</label>
        <textarea name="skills" placeholder="Leadership, Strategy, Innovation, Business Development..."></textarea>
      </div>
      <div class="form-group">
        <label>Milestones / Achievements</label>
        <textarea name="milestones" placeholder="• 20+ years of industry experience&#10;• Founded 3 successful startups..."></textarea>
      </div>
      <div class="form-group">
        <label>Testimonials</label>
        <textarea name="testimonials" placeholder='"An exceptional leader..." - Business Partner'></textarea>
      </div>
    </div>

    <!-- Company Section -->
    <div class="form-card">
      <h2 class="section-title">Company Information</h2>
      <div class="form-group">
        <label>Company Description</label>
        <textarea name="company_desc" placeholder="Brief description of your company..."></textarea>
      </div>
      <div class="form-group">
        <label>Products / Services</label>
        <textarea name="products" placeholder="List your key products or services..."></textarea>
      </div>
      <div class="form-group">
        <label>Company Website</label>
        <input type="url" name="website" placeholder="https://www.sterling.com" />
      </div>
      <div class="form-group">
        <label>Company Location (Google Maps URL)</label>
        <input type="url" name="company_location" placeholder="https://maps.google.com/?q=..." />
      </div>
      <div class="form-group">
        <label>Company Logo</label>
        <div class="file-input-wrapper">
          <label class="file-input-label" for="logo">
            <span>Click to upload logo (JPG, PNG, SVG)</span>
          </label>
          <input type="file" id="logo" name="logo" accept="image/jpeg,image/png,image/svg+xml,image/webp" />
        </div>
        <img id="logo-preview" class="preview-image" alt="Logo Preview" />
      </div>
    </div>

    <!-- Social Media Section -->
    <div class="form-card">
      <h2 class="section-title">Social Media Links</h2>
      <div class="form-group"><label>Facebook</label><input type="text" name="facebook" placeholder="facebook.com/yourprofile" /></div>
      <div class="form-group"><label>Instagram</label><input type="text" name="instagram" placeholder="@yourusername" /></div>
      <div class="form-group"><label>Twitter / X</label><input type="text" name="twitter" placeholder="@yourusername" /></div>
      <div class="form-group"><label>LinkedIn</label><input type="text" name="linkedin" placeholder="linkedin.com/in/yourprofile" /></div>
      <div class="form-group"><label>YouTube</label><input type="text" name="youtube" placeholder="youtube.com/@yourchannel" /></div>
      <div class="form-group"><label>TikTok</label><input type="text" name="tiktok" placeholder="@yourusername" /></div>
      <div class="form-group"><label>Pinterest</label><input type="text" name="pinterest" placeholder="pinterest.com/yourprofile" /></div>
      <div class="form-group"><label>Telegram</label><input type="text" name="telegram" placeholder="@yourusername" /></div>
    </div>

    <!-- Submit -->
    <div class="form-card">
      <button type="submit" class="submit-btn">💾 Save & Update Card</button>
    </div>

  </form>

  <div class="footer">
    <p>Powered by <a href="#">Premium NFC Cards</a></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
