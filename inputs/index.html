<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update NFC Card | Premium NFC Cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #e8c547;
      --dark-bg: hsl(220, 20%, 10%);
      --card-bg: hsl(220, 18%, 13%);
      --input-bg: hsl(220, 18%, 16%);
      --border: rgba(212, 175, 55, 0.2);
      --text: #f5f5f5;
      --text-muted: rgba(255, 255, 255, 0.6);
    }
    * {margin:0; padding:0; box-sizing:border-box;}
    body {font-family:'Montserrat',sans-serif; background:var(--dark-bg); color:var(--text); min-height:100vh; padding:20px;}
    .container {max-width:600px; margin:0 auto;}
    .header {text-align:center; margin-bottom:32px; padding:24px; background:linear-gradient(145deg,var(--card-bg),hsl(220,20%,8%)); border-radius:16px; border:1px solid var(--border);}
    .header h1 {font-family:'Playfair Display', serif; font-size:28px; color:var(--gold); margin-bottom:8px;}
    .header p {font-size:14px; color:var(--text-muted);}
    .form-card {background:linear-gradient(145deg,var(--card-bg),hsl(220,20%,8%)); border-radius:20px; border:1px solid var(--border); padding:24px; margin-bottom:20px;}
    .section-title {font-family:'Playfair Display',serif; font-size:20px; color:var(--gold); margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
    .section-title::before {content:''; width:4px; height:20px; background:var(--gold); border-radius:2px;}
    .form-group {margin-bottom:20px;}
    label {display:block; font-size:13px; font-weight:500; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;}
    label .required {color:#ef4444;}
    input[type="text"], input[type="email"], input[type="tel"], input[type="url"], textarea {
      width:100%; padding:14px 16px; background:var(--input-bg); border:1px solid var(--border); border-radius:12px; color:var(--text); font-family:'Montserrat',sans-serif; font-size:15px; transition:all 0.3s ease;
    }
    input:focus, textarea:focus {outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.1);}
    input::placeholder, textarea::placeholder {color:rgba(255,255,255,0.3);}
    textarea {min-height:100px; resize:vertical;}
    .file-input-wrapper {position:relative;}
    .file-input-label {display:flex; align-items:center; justify-content:center; gap:12px; padding:20px; background:var(--input-bg); border:2px dashed var(--border); border-radius:12px; cursor:pointer; transition:all 0.3s ease;}
    .file-input-label:hover {border-color:var(--gold); background:rgba(212,175,55,0.05);}
    .file-input-label svg {width:24px; height:24px; color:var(--gold);}
    .file-input-label span {color:var(--text-muted); font-size:14px;}
    input[type="file"] {position:absolute; opacity:0; width:100%; height:100%; top:0; left:0; cursor:pointer;}
    .input-hint {font-size:12px; color:var(--text-muted); margin-top:6px; opacity:0.7;}
    .input-row {display:grid; grid-template-columns:1fr 1fr; gap:16px;}
    @media (max-width:480px) {.input-row {grid-template-columns:1fr;}}
    .submit-btn {width:100%; padding:16px 32px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); border:none; border-radius:12px; color:#0f1419; font-family:'Montserrat',sans-serif; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.3s ease; text-transform:uppercase; letter-spacing:1px;}
    .submit-btn:hover {transform:translateY(-2px); box-shadow:0 8px 24px rgba(212,175,55,0.3);}
    .submit-btn:active {transform:translateY(0);}
    .footer {text-align:center; padding:24px; color:var(--text-muted); font-size:13px;}
    .footer a {color:var(--gold); text-decoration:none;}
    .preview-image {width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); display:none; margin-top:12px;}
    .social-input {position:relative;}
    .social-input .prefix {position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px;}
    .social-input input {padding-left:140px;}
    .social-input.short input {padding-left:40px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✨ Update Your NFC Card</h1>
      <p>Fill in your details to personalize your premium digital card</p>
    </div>

    <form id="nfc-form">
      <!-- Basic Info -->
      <div class="form-card">
        <h2 class="section-title">Basic Information</h2>
        <div class="form-group">
          <label>Card ID <span class="required">*</span></label>
          <input type="text" name="card_id" placeholder="e.g., CARD001" required />
        </div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="name" placeholder="Jonathan Sterling" required />
        </div>
        <div class="input-row">
          <div class="form-group">
            <label>Title / Designation</label>
            <input type="text" name="title" placeholder="CEO" />
          </div>
          <div class="form-group">
            <label>Company</label>
            <input type="text" name="company" placeholder="Sterling Industries" />
          </div>
        </div>
        <div class="form-group">
          <label>Profile Photo</label>
          <div class="file-input-wrapper">
            <label class="file-input-label" for="photo">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>Click to upload photo (JPG, PNG)</span>
            </label>
            <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" />
          </div>
          <img id="photo-preview" class="preview-image" alt="Preview" />
        </div>
      </div>

      <!-- Contact Section -->
      <div class="form-card">
        <h2 class="section-title">Contact Details</h2>
        <div class="input-row">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="+1 234 567 890" />
          </div>
          <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="tel" name="whatsapp" placeholder="+1 234 567 890" />
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="contact@sterling.com" />
        </div>
      </div>

      <!-- Submit -->
      <div class="form-card">
        <button type="submit" class="submit-btn">💾 Save & Update Card</button>
      </div>
    </form>

    <div class="footer">
      <p>Powered by <a href="#">Premium NFC Cards</a></p>
    </div>
  </div>

<script>
const API_URL = "https://nfc-develop.data-brandstack.workers.dev/api/update";
const ADMIN_TOKEN = "3f7c1e9a-6c2b-4b5e-9d44-91c2c0a6b9fd";

let photoBase64 = "";

// Profile photo preview & Base64
document.getElementById('photo').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    document.getElementById('photo-preview').src = evt.target.result;
    document.getElementById('photo-preview').style.display = 'block';
    // Remove data prefix for VCF
    photoBase64 = evt.target.result.split(',')[1];
  };
  reader.readAsDataURL(file);
});

// Generate VCF file
function generateVCF(data) {
  let vcf = `BEGIN:VCARD
VERSION:3.0
FN:${data.name || ""}
ORG:${data.company || ""}
TITLE:${data.title || ""}
TEL;TYPE=WORK,VOICE:${data.phone || ""}
EMAIL:${data.email || ""}
`;
  if(photoBase64){
    vcf += `PHOTO;ENCODING=b;TYPE=JPEG:${photoBase64}\n`;
  }
  vcf += "END:VCARD";

  const blob = new Blob([vcf], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${data.name || 'contact'}.vcf`;
  a.click();
  URL.revokeObjectURL(url);
}

// Form submission
document.getElementById('nfc-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const formData = new FormData(this);
  const submitBtn = this.querySelector('.submit-btn');
  submitBtn.textContent = 'Updating...';
  submitBtn.disabled = true;

  try{
    const response = await fetch(API_URL,{
      method:'POST',
      headers:{ 'Authorization': `Bearer ${ADMIN_TOKEN}` },
      body: formData
    });
    const result = await response.json();
    if(!response.ok) throw new Error(result.message || 'Update failed');

    alert('✅ Your NFC card has been updated successfully!');
    
    // Generate VCF after success
    const vcfData = Object.fromEntries(formData.entries());
    generateVCF(vcfData);

  } catch(err){
    console.error(err);
    alert('❌ Failed to update card. Please try again.');
  } finally{
    submitBtn.textContent = '💾 Save & Update Card';
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
