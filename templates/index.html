<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{NAME}} | Premium NFC Card</title>
  <meta name="description" content="Premium Digital NFC Business Card - {{NAME}}" />
  <meta name="theme-color" content="#0f1419" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="avatar-wrapper">
          <div class="avatar">
            <img id="avatar" alt="Profile Photo">
            <i class="fas fa-user avatar-fallback"></i>
          </div>
        </div>
        <h1 class="name">{{NAME}}</h1>
        <p class="title">{{TITLE}}</p>
        <p class="company">{{COMPANY}}</p>
        <p class="tagline">{{TAGLINE}}</p>
      </div>

      <!-- Contact Section -->
      <div class="section-header">Contact :</div>
      <div class="section-content">
        <div class="action-grid four-col">
          <a id="call" class="action-item">
            <div class="icon-box"><i class="fas fa-phone"></i></div>
            <span>Call</span>
          </a>
          <a id="whatsapp" class="action-item" target="_blank" rel="noopener noreferrer">
            <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
            <span>WhatsApp</span>
          </a>
          <a id="email" class="action-item">
            <div class="icon-box"><i class="fas fa-envelope"></i></div>
            <span>Email</span>
          </a>
          <a id="upi" class="action-item">
            <div class="icon-box"><i class="fas fa-qrcode"></i></div>
            <span>Pay Me</span>
          </a>
        </div>
        <div class="action-grid three-col">
          <a id="save" class="action-item">
            <div class="icon-box"><i class="fas fa-download"></i></div>
            <span>Save Me</span>
          </a>
          <a id="share" class="action-item">
            <div class="icon-box"><i class="fas fa-share-alt"></i></div>
            <span>Share</span>
          </a>
          <a id="location" class="action-item" target="_blank" rel="noopener noreferrer">
            <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
            <span>Location</span>
          </a>
        </div>
      </div>

      <!-- Company Section -->
      <div class="section-header">Company :</div>
      <div class="section-content">
        <div class="action-grid four-col">
          <a id="website" class="action-item" target="_blank" rel="noopener noreferrer">
            <div class="icon-box"><i class="fas fa-globe"></i></div>
            <span>Website</span>
          </a>
        </div>
      </div>

      <!-- Follow Me Section -->
      <div class="section-header">Follow Me :</div>
      <div class="section-content social-section">
        <div class="social-icons">
          <a id="facebook" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
          </a>
          <a id="instagram" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
          </a>
          <a id="youtube" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <i class="fab fa-youtube"></i>
          </a>
          <a id="linkedin" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a id="twitter" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
            <i class="fab fa-twitter"></i>
          </a>
        </div>
      </div>

      <!-- Footer -->
      <footer class="card-footer">
        <p>Powered by Premium NFC Cards</p>
      </footer>
    </div>
  </div>
</body>
</html>
