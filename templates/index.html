<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium NFC Card</title>
  <meta name="description" content="Premium Digital NFC Business Card" />
  <meta name="author" content="Company" />
  <meta name="theme-color" content="#0f1419" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="profile-header">
        <div class="avatar-wrapper">
          <div class="avatar" id="avatar">
            <img id="avatar-img" src="" alt="Profile Picture">
          </div>
          <input type="file" id="avatar-upload" accept="image/*" style="display:none">
        </div>
        <h1 class="name" id="name">Your Name</h1>
        <p class="title" id="title">Your Title</p>
        <p class="company" id="company">Company Name</p>
        <p class="tagline" id="tagline">"Your Tagline"</p>
      </div>

      <!-- Contact Section -->
      <div class="section-header">Contact :</div>
      <div class="section-content">
        <div class="action-grid four-col">
          <a href="#" id="call" class="action-item">
            <div class="icon-box"><i class="fas fa-phone"></i></div><span>Call</span>
          </a>
          <a href="#" id="whatsapp" target="_blank" rel="noopener noreferrer" class="action-item">
            <div class="icon-box"><i class="fab fa-whatsapp"></i></div><span>WhatsApp</span>
          </a>
          <a href="#" id="email" class="action-item">
            <div class="icon-box"><i class="fas fa-envelope"></i></div><span>Email</span>
          </a>
          <label for="pay-modal" id="upi" class="action-item">
            <div class="icon-box"><i class="fas fa-qrcode"></i></div><span>Pay Me</span>
          </label>
        </div>
        <div class="action-grid three-col">
          <a href="#" id="save-contact" class="action-item">
            <div class="icon-box"><i class="fas fa-download"></i></div><span>Save Me</span>
          </a>
          <div id="share" class="action-item">
            <div class="icon-box"><i class="fas fa-share-alt"></i></div><span>Share</span>
          </div>
          <a href="#" id="location" target="_blank" rel="noopener noreferrer" class="action-item">
            <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div><span>Location</span>
          </a>
        </div>
      </div>

      <!-- Profile Section -->
      <div class="section-header">Profile :</div>
      <div class="section-content">
        <div class="action-grid four-col">
          <label for="about-modal" id="about" class="action-item">
            <div class="icon-box"><i class="fas fa-user"></i></div><span>About Me</span>
          </label>
          <label for="skills-modal" id="skills" class="action-item">
            <div class="icon-box"><i class="fas fa-briefcase"></i></div><span>Skills</span>
          </label>
          <label for="milestones-modal" id="milestones" class="action-item">
            <div class="icon-box"><i class="fas fa-trophy"></i></div><span>Milestone</span>
          </label>
          <label for="testimonials-modal" id="testimonials" class="action-item">
            <div class="icon-box"><i class="fas fa-users"></i></div><span>Testimony</span>
          </label>
        </div>
      </div>

      <!-- Company Section -->
      <div class="section-header">Company :</div>
      <div class="section-content">
        <div class="action-grid four-col">
          <label for="company-modal" id="company-info" class="action-item">
            <div class="icon-box"><i class="fas fa-building"></i></div><span>Company</span>
          </label>
          <label for="products-modal" id="products" class="action-item">
            <div class="icon-box"><i class="fas fa-box"></i></div><span>Products</span>
          </label>
          <a href="#" id="website" target="_blank" rel="noopener noreferrer" class="action-item">
            <div class="icon-box"><i class="fas fa-globe"></i></div><span>Website</span>
          </a>
          <a href="#" id="company-location" target="_blank" rel="noopener noreferrer" class="action-item">
            <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div><span>Location</span>
          </a>
        </div>
      </div>

      <!-- Follow Me Section -->
      <div class="section-header">Follow Me :</div>
      <div class="section-content social-section">
        <div class="social-icons" id="social-links">
          <!-- Social links injected via JS -->
        </div>
      </div>

      <footer class="card-footer">
        <p>Powered by Premium NFC Cards</p>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
